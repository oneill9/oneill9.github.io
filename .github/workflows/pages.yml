name: Test and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test directory and sitemaps
        run: python3 -m unittest discover -s tests -v
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html 404.html styles.css robots.txt sitemap.xml pages-sitemap.xml 7a063a25e890b5f15600e7fc94e6d97c.txt _site/
          cp -R assets _site/
      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexnow:
    name: Notify IndexNow
    needs: deploy
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify IndexNow
        run: |
          test "$(curl --silent --show-error --fail \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "https://oneill9.github.io/7a063a25e890b5f15600e7fc94e6d97c.txt")" \
            = "7a063a25e890b5f15600e7fc94e6d97c"
          curl --silent --show-error --fail-with-body \
            --request POST "https://api.indexnow.org/indexnow" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary '{
              "host": "oneill9.github.io",
              "key": "7a063a25e890b5f15600e7fc94e6d97c",
              "keyLocation": "https://oneill9.github.io/7a063a25e890b5f15600e7fc94e6d97c.txt",
              "urlList": [
                "https://oneill9.github.io/",
                "https://oneill9.github.io/print-to-notes/"
              ]
            }'
          echo "### IndexNow" >> "$GITHUB_STEP_SUMMARY"
          echo "Notified search engines of updated pages" >> "$GITHUB_STEP_SUMMARY"
